name: mindspark
description: A new Flutter project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_bloc: ^8.1.3
  equatable: ^2.0.8
  dio: ^5.3.2
  get_it: ^7.6.0
  go_router: ^12.0.0
  # HTTP & Storage
  http: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3
  # JSON serialization
  json_annotation: ^4.8.1
  # State management & DI
  provider: ^6.1.1
  riverpod: ^2.4.9
  # Utils
  dartz: ^0.10.1
  # Image Picker
  image_picker: ^1.0.7
  # Text to Speech
  flutter_tts: ^4.0.2
  # WebSocket
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  # Code generation
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  # Testing
  mockito: ^5.4.4

flutter:
  uses-material-design: true
